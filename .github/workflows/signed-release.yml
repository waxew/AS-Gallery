name: Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build signed AS Gallery release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AS_GALLERY_KEYSTORE_BASE64: ${{ secrets.AS_GALLERY_KEYSTORE_BASE64 }}
      AS_GALLERY_KEYSTORE_PASSWORD: ${{ secrets.AS_GALLERY_KEYSTORE_PASSWORD }}
      AS_GALLERY_KEY_ALIAS: ${{ secrets.AS_GALLERY_KEY_ALIAS }}
      AS_GALLERY_KEY_PASSWORD: ${{ secrets.AS_GALLERY_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Validate release version and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AS_GALLERY_KEYSTORE_BASE64 AS_GALLERY_KEYSTORE_PASSWORD AS_GALLERY_KEY_ALIAS AS_GALLERY_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version_name" ]; then
            echo 'Unable to determine versionName from app/build.gradle.kts' >&2
            exit 1
          fi
          echo "AS_GALLERY_VERSION=$version_name" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version_name" >&2
            exit 1
          fi

      - name: Materialize private keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AS_GALLERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-gallery.jks"
          chmod 600 "$RUNNER_TEMP/as-gallery.jks"
          echo "AS_GALLERY_KEYSTORE_PATH=$RUNNER_TEMP/as-gallery.jks" >> "$GITHUB_ENV"

      - name: Unit tests and Android Lint
        run: ./gradlew --no-daemon :common:testCommunityDebugUnitTest :app:testCommunityDebugUnitTest :app:lintCommunityDebug

      - name: Build signed Community Release
        run: ./gradlew --no-daemon :app:assembleCommunityRelease

      - name: Verify signature and create release pack
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/community/release -type f -name '*.apk' | head -n 1)
          test -n "$apk"

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"

          mkdir -p release-artifacts
          output="release-artifacts/AS-Gallery-v${AS_GALLERY_VERSION}-release.apk"
          cp "$apk" "$output"
          "$apksigner" verify --verbose --print-certs "$output" | tee release-artifacts/SIGNATURE.txt
          sha256sum "$output" > release-artifacts/SHA256SUMS.txt
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload signed release pack
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gallery-v${{ env.AS_GALLERY_VERSION }}-signed
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/AS-Gallery-v${AS_GALLERY_VERSION}-release.apk \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/SIGNATURE.txt \
            --verify-tag \
            --title "AS Gallery v${AS_GALLERY_VERSION}" \
            --generate-notes
