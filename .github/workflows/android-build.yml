name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AS Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Unit tests
        run: ./gradlew --stacktrace :app:testCommunityDebugUnitTest

      - name: Build Community Debug APK
        run: ./gradlew --stacktrace :app:assembleCommunityDebug

      - name: Build Community Release APK
        run: ./gradlew --stacktrace :app:assembleCommunityRelease

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as-gallery-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
