name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AS Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify wrapper and environment
        run: ./gradlew --version

      - name: Unit tests and Android Lint
        run: ./gradlew --no-daemon :common:testCommunityDebugUnitTest :app:testCommunityDebugUnitTest :app:lintCommunityDebug

      - name: Build Community Debug and Release
        run: ./gradlew --no-daemon :app:assembleCommunityDebug :app:assembleCommunityRelease

      - name: Prepare APKs and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find app/build/outputs/apk/community -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            cp "$apk" release-artifacts/
          done
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified APK pack
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gallery-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gallery-lint-${{ github.sha }}
          path: app/build/reports/lint-results-communityDebug.*
          if-no-files-found: ignore
          retention-days: 14
