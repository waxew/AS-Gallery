name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AS Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify wrapper and environment
        run: ./gradlew --version

      - name: Unit tests and Android Lint
        run: ./gradlew --no-daemon :common:testCommunityDebugUnitTest :app:testCommunityDebugUnitTest :app:lintCommunityDebug

      - name: Build Community Debug and Release
        run: ./gradlew --no-daemon :app:assembleCommunityDebug :app:assembleCommunityRelease

      - name: Prepare complete verified delivery pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          find app/build/outputs/apk/community -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            cp "$apk" release-artifacts/
          done

          # Source snapshot is generated from the exact commit that produced the APKs.
          git archive --format=zip --output="release-artifacts/AS-Gallery-source-${GITHUB_SHA}.zip" HEAD

          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          cat > release-artifacts/info.txt <<EOF
          AS Gallery verified CI build
          ============================
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Application ID: com.asteam.gallery
          Version name: ${version_name}
          Version code: ${version_code}
          Edition: community
          Unit tests: PASS
          Android Lint: PASS
          Debug build: PASS
          Release build: PASS
          Release signing: unsigned in verification CI; use Signed Release workflow for distribution signing.
          EOF

          cd release-artifacts
          sha256sum *.apk AS-Gallery-source-*.zip > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload complete verified build pack
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gallery-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gallery-lint-${{ github.sha }}
          path: app/build/reports/lint-results-communityDebug.*
          if-no-files-found: ignore
          retention-days: 14
